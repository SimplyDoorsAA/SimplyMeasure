<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SimplyDoors">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Professional Measurement Tool for SimplyDoors">
<title>SimplyDoors Measure App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    /* =========================================
       1. VARIABLES & GLOBAL RESET
       ========================================= */
    :root {
        --brand-green: #7bc043;
        --brand-dark: #2c3e50;
        --brand-bg: #f4f7f6;
        --brand-white: #ffffff;
        --ui-blue: #007bff;
        --ui-danger: #dc3545;
        --shadow-card: 0 4px 20px rgba(0,0,0,0.06);
        --radius: 12px;
        --alert-red: #ff0000;
        --gray-container: #f8f9fa;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background-color: var(--brand-bg);
        margin: 0; padding: 0; 
        padding-top: env(safe-area-inset-top);
        padding-bottom: 160px;
        color: #333;
        -webkit-font-smoothing: antialiased;
    }

    .main-wrapper { padding: 15px; max-width: 850px; margin: 0 auto; }
    .container { 
        background: var(--brand-white); border-radius: var(--radius); 
        box-shadow: var(--shadow-card); overflow: hidden; min-height: 80vh; padding-bottom: 40px;
    }

    /* =========================================
       2. HEADER & OVERLAYS
       ========================================= */
    .app-header {
        background: var(--brand-white);
        padding-top: calc(15px + env(safe-area-inset-top)); 
        padding-bottom: 20px; padding-left: 20px; padding-right: 20px;
        text-align: center;
        box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        border-bottom: 4px solid var(--brand-green);
        position: sticky; top: 0; z-index: 900;
    }
    .logo-container img { height: 55px; width: auto; display: inline-block; }
    .logo-text { font-size: 28px; font-weight: 800; color: var(--brand-dark); display: none; letter-spacing: -0.5px; line-height: 1; }
    .logo-text span { color: var(--brand-green); }
    .app-subtitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #999; margin-top: 6px; }

    .auth-actions { position: absolute; right: 20px; top: calc(20px + env(safe-area-inset-top)); display: flex; gap: 12px; align-items: center; }
    .auth-actions button { background: none; border: none; color: #666; font-size: 13px; font-weight: 700; cursor: pointer; display: none; }
    .auth-actions button:hover { color: var(--brand-dark); }
    #btn-history { color: var(--ui-blue); }

    /* Login Screen */
    #login-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: var(--brand-bg); z-index: 9999; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .login-box {
        background: white; padding: 40px 30px; border-radius: 16px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 360px;
        text-align: center;
    }
    .login-box h2 { color: var(--brand-dark); margin: 0 0 5px 0; font-size: 24px; font-weight: 800; }
    .login-box p { color: #888; font-size: 13px; font-weight: 600; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
    .login-box input { margin-bottom: 15px; width: 100%; }
    .login-box button {
        width: 100%; padding: 16px; background: var(--brand-green); color: white;
        border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
        cursor: pointer; transition: opacity 0.2s;
    }
    .login-box button:active { opacity: 0.8; }
    #login-error { color: var(--ui-danger); font-size: 13px; font-weight: 600; margin-top: 15px; min-height: 20px; }

    /* History Screen */
    #history-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: var(--brand-bg); z-index: 9998; 
        display: none; flex-direction: column; padding: calc(20px + env(safe-area-inset-top)) 20px 20px 20px; overflow-y: auto;
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; max-width: 850px; margin-left: auto; margin-right: auto; width: 100%; }
    .history-header h2 { margin: 0; color: var(--brand-dark); font-size: 22px; font-weight: 800; }
    .btn-close-history { background: var(--ui-danger); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #history-list { max-width: 850px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }
    .history-card { background: white; padding: 18px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border-left: 5px solid var(--brand-green); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.1s; }
    .history-card:active { transform: scale(0.98); }
    .history-card-title { font-weight: 800; color: var(--brand-dark); font-size: 16px; margin-bottom: 5px; }
    .history-card-sub { font-size: 12px; font-weight: 600; color: #888; }
    .history-card-action { color: var(--ui-blue); font-weight: 800; font-size: 14px; }

    /* =========================================
       3. UI COMPONENTS
       ========================================= */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        z-index: 2000; display: none; align-items: center; justify-content: center;
    }
    .modal-box {
        background: white; width: 90%; max-width: 400px; padding: 30px; 
        border-radius: 16px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: var(--brand-dark); }
    .modal-btn-row { display: flex; gap: 15px; }
    .modal-btn {
        flex: 1; padding: 20px; border-radius: 12px; border: 2px solid #eee;
        background: #f8f9fa; font-size: 16px; font-weight: 700; cursor: pointer;
        transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .modal-btn:active { transform: scale(0.95); }
    .modal-btn.is-door { color: var(--brand-green); border-color: var(--brand-green); background: #f0fff4; }
    .modal-btn.is-door svg { width: 30px; height: 30px; fill: var(--brand-green); }
    .modal-btn.is-window { color: var(--ui-blue); border-color: var(--ui-blue); background: #f0f7ff; }
    .modal-btn.is-window svg { width: 30px; height: 30px; fill: var(--ui-blue); }

    .save-indicator {
        position: fixed; top: 20px; right: 20px; font-size: 12px; font-weight: 700;
        background: var(--brand-green); color: white; padding: 8px 16px; border-radius: 30px;
        opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
        margin-top: env(safe-area-inset-top); 
    }
    .save-indicator.error { background: var(--ui-danger); }

    .empty-state {
        text-align: center; padding: 60px 20px; color: #a0aec0;
        border: 2px dashed #e2e8f0; border-radius: 12px; margin: 20px; background: #fafbfc;
    }
    
    /* Standard Inputs */
    .section { padding: 25px 20px; border-bottom: 1px solid #f0f0f0; }
    .section-title { font-size: 14px; color: var(--brand-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px; margin-top: 10px; }
    .row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
    .col { flex: 1; min-width: 120px; }
    label { display: block; margin-top: 18px; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input:not([type="checkbox"]), select, textarea { 
        width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px;
        font-size: 16px; background: #fff; color: #2d3748; -webkit-appearance: none; appearance: none; 
    }
    select:invalid, select option[value=""] { color: var(--ui-blue); font-weight: 600; }
    textarea { resize: vertical; min-height: 80px; line-height: 1.4; }
    .sub-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #a0aec0; margin-bottom: 4px; display: block; }

    /* Composite Input */
    .composite-input { display: flex; align-items: center; width: 100%; }
    .composite-input input { 
        border-top-right-radius: 0; border-bottom-right-radius: 0; 
        flex: 1.5; min-width: 0; z-index: 2; 
    }
    .composite-input select { 
        border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; 
        background-color: #f8f9fa; font-weight: 500; text-align: center; 
        flex: 1; min-width: 65px; padding-left: 5px; padding-right: 5px;
    }

    /* Custom Toggles */
    .toggle-wrapper { position: relative; width: 100%; }
    .custom-input-group { display: flex; gap: 8px; align-items: center; }
    .undo-btn { background: #edf2f7; color: #718096; border: none; width: 46px; height: 48px; border-radius: 8px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    
    /* Checklist */
    .checklist-container { background-color: var(--gray-container); border-radius: 10px; padding: 10px 15px; margin-top: 5px; border: 1px solid #edf2f7; }
    .checklist-item { display: flex; align-items: center; padding: 12px 0; cursor: pointer; user-select: none; }
    .checklist-item.active .custom-checkbox { background-color: #333; border-color: #333; }
    .checklist-item.active .custom-checkbox::after { content: '✓'; color: white; font-size: 18px; font-weight: 800; }
    .custom-checkbox { width: 24px; height: 24px; border: 2px solid #ccc; border-radius: 6px; margin-right: 12px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .checklist-text { font-size: 14px; font-weight: 600; color: #555; }

    /* Tempered Toggle */
    .win-toggle-wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .win-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .win-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--alert-red); }
    input:checked + .slider:before { transform: translateX(22px); }
    .win-toggle-label { font-size: 11px; font-weight: 800; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .win-toggle-wrap.is-tempered .win-toggle-label { color: var(--alert-red); }

    /* Dynamic Rows */
    .measure-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
    .remove-row { color: #e53e3e; font-weight: bold; padding: 10px; cursor: pointer; font-size: 20px; }
    .btn-add-point { background: none; border: 2px dashed #cbd5e0; width: 100%; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 5px; color: #555; }

    /* Photos */
    .photo-grid { display: flex; gap: 10px; margin-top: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; }
    .photo-box {
        flex: 1; min-width: 100px; height: 120px; border: 2px dashed #cbd5e0; border-radius: 10px;
        background-color: #f7fafc; display: flex; align-items: center; justify-content: center;
        cursor: pointer; position: relative; overflow: hidden;
    }
    .photo-box.has-image { border: 2px solid var(--brand-green); background-color: #fff; }
    .photo-box input[type="file"] { display: none; }
    .photo-placeholder { text-align: center; font-size: 11px; font-weight: 600; color: #718096; pointer-events: none; }
    .photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; max-width: 100%; }
    .photo-spinner { display: none; border: 3px solid #f3f3f3; border-top: 3px solid var(--brand-green); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .photo-clear {
        display: none; position: absolute; top: 5px; right: 5px; background: rgba(220, 53, 69, 0.9);
        color: white; border-radius: 50%; width: 26px; height: 26px; text-align: center;
        line-height: 24px; cursor: pointer; z-index: 10; font-weight: bold; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .photo-box.has-image .photo-clear { display: block; }

    /* Cards */
    .measure-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 25px; margin-bottom: 30px; position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .measure-card[data-type="door"] { border-left: 6px solid var(--brand-green); }
    .measure-card[data-type="window"] { border-left: 6px solid var(--ui-blue); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: white; }
    .measure-card[data-type="door"] .card-badge { background: var(--brand-green); }
    .measure-card[data-type="window"] .card-badge { background: var(--ui-blue); }
    .btn-delete { background: #fff1f2; color: #e53e3e; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pdf-brand { display: none; }

    /* Footer Buttons */
    .btn-group { 
        padding: 15px 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
        position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #e2e8f0; 
        box-shadow: 0 -4px 25px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 10px;
        z-index: 999; padding-bottom: calc(15px + env(safe-area-inset-bottom));
    }
    button.action-btn { 
        flex: 1; padding: 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; 
        cursor: pointer; color: white; text-align: center; min-width: 100px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.1s;
    }
    button.action-btn:active { transform: scale(0.98); }
    .btn-add { background-color: var(--brand-dark); } 
    .btn-dup { background-color: #6f42c1; } 
    .btn-print { background-color: var(--ui-blue); } 
    .btn-reset { background-color: var(--ui-danger); flex-basis: 100%; margin-top: 5px; opacity: 0.9; font-size: 13px; padding: 12px; }

    /* Mobile Responsive Overrides */
    @media (max-width: 768px) {
        .row { flex-direction: column; align-items: stretch; gap: 0; }
        .col { width: 100%; margin-bottom: 10px; }
        .win-toggle-wrap { align-items: flex-start; margin-top: 10px !important; }
        .photo-box { height: 100px; }
        .measure-card { padding: 15px; }
    }

    /* =========================================
       4. PRINTING MODE (PDF ENGINE)
       ========================================= */
    .printing-mode body { background: white; margin: 0; padding: 0 !important; }
    .printing-mode .main-wrapper { padding: 0; width: 750px; margin: 0 auto; }
    .printing-mode .container { box-shadow: none; border: none; border-radius: 0; padding: 0; min-height: auto; }
    
    .printing-mode .btn-group, .printing-mode .btn-delete, .printing-mode .save-indicator, 
    .printing-mode .undo-btn, .printing-mode .app-header, .printing-mode .btn-add-point, 
    .printing-mode .remove-row, .printing-mode .empty-state, .printing-mode .modal-overlay,
    .printing-mode .photo-clear, .printing-mode .photo-placeholder { display: none !important; }

    .printing-mode .job-cover-page {
        display: block; width: 100%; padding: 40px; height: auto; min-height: 90vh;
        page-break-after: always; break-after: page; border-bottom: none;
    }
    .printing-mode .cover-header { text-align: center; margin-bottom: 40px; border-bottom: 4px solid var(--brand-green); padding-bottom: 20px; }
    .printing-mode .cover-header h1 { font-size: 42px; color: var(--brand-dark); margin: 0; }
    .printing-mode .cover-header p { font-size: 16px; color: #666; text-transform: uppercase; letter-spacing: 4px; margin-top: 5px; }
    .printing-mode .cover-box { border: 2px solid #333; padding: 25px; border-radius: 8px; background: #fff; margin-bottom: 30px; }
    .printing-mode .tech-info-print { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; font-size: 13px; line-height: 1.6; color: #444; display: block !important; }
    .printing-mode .tech-info-print strong { color: var(--brand-dark); }
    .printing-mode .measure-card { box-shadow: none; border: 2px solid #333; margin: 0; padding: 30px; margin-bottom: 30px; display: block; page-break-inside: avoid; }
    .printing-mode .pdf-brand { display: block; text-align: right; color: #aaa; font-size: 12px; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .printing-mode label { margin-top: 15px; font-size: 11px; color: #666; text-transform: uppercase; }
    .printing-mode input, .printing-mode select { border: none; border-bottom: 1px solid #000; border-radius: 0; padding: 4px 0; font-weight: 700; font-size: 14px; background: transparent; color: #000; margin-bottom: 5px; }
    .printing-mode textarea { border: 1px solid #ddd; padding: 10px; font-size: 12px; margin-top: 5px; }
    
    .printing-mode .row { display: block !important; width: 100%; margin-bottom: 5px; }
    .printing-mode .col { display: inline-block !important; width: 48%; vertical-align: top; margin-bottom: 5px; }
    .printing-mode .composite-input { display: inline-block !important; width: 100%; }
    .printing-mode .composite-input input { display: inline-block !important; width: 40%; }
    .printing-mode .composite-input select { display: inline-block !important; width: auto; min-width: 50px; margin-left: 5px; }
    .printing-mode .checklist-container { background: transparent; border: none; padding: 0; margin-top: 10px;}
    .printing-mode .checklist-item:not(.active) { display: none !important; }
    .printing-mode .checklist-item { display: block !important; padding: 4px 0; }
    .printing-mode .custom-checkbox { display: inline-block !important; vertical-align: middle; margin-right: 8px; border: none; width: auto; background: transparent; }
    .printing-mode .custom-checkbox:after { content: "☑"; color: black; font-size: 18px; line-height: 1; }
    .printing-mode .checklist-text { display: inline-block !important; vertical-align: middle; line-height: 1; margin-top: 2px;}
    .printing-mode .photo-grid { display: block !important; margin-top: 25px; overflow: hidden; white-space: nowrap; }
    .printing-mode .photo-box { display: inline-block !important; width: 31%; height: auto; min-height: 150px; margin-right: 2%; vertical-align: top; border: none; background: transparent; }
    .printing-mode .photo-box:last-child { margin-right: 0; }
    .printing-mode .photo-box:not(.has-image) { opacity: 0.1; border: 1px dashed #ccc; min-height: 150px; }
    .printing-mode .photo-preview { display: block !important; width: 100%; height: auto; max-height: 220px; object-fit: contain; }
    .printing-mode .tempered-print-only { display: block !important; font-weight: 900; color: var(--alert-red); border: 3px solid var(--alert-red); padding: 10px; text-align: center; margin-top: 20px; font-size: 16px; }
    .printing-mode .win-switch, .printing-mode .slider, .signature-line { display: none; }
    .printing-mode .hide-in-print { display: none !important; }
</style>
</head>
<body>

<!-- PHASE 1: LOGIN OVERLAY -->
<div id="login-overlay">
    <div class="login-box">
        <h2>SimplyDoors</h2>
        <p>Field Tech Access</p>
        <input type="email" id="login-email" placeholder="Email Address" autocomplete="email">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <button id="btn-signin">Sign In</button>
        <div id="login-error"></div>
    </div>
</div>

<!-- PHASE 4: HISTORY DASHBOARD OVERLAY -->
<div id="history-overlay">
    <div class="history-header">
        <h2>Previous Measures</h2>
        <button class="btn-close-history" onclick="document.getElementById('history-overlay').style.display='none'">Close</button>
    </div>
    <div id="history-list"></div>
</div>

<header class="app-header">
    <div class="logo-container">
        <img src="logo.png" alt="SimplyDoors" onerror="this.style.display='none'; document.querySelector('.logo-text').style.display='block';">
        <div class="logo-text">Simply<span>Doors</span></div>
    </div>
    <div class="app-subtitle">SimplyDoors Measure App</div>
    <div class="auth-actions">
        <button id="btn-history" onclick="openHistory()">History</button>
        <button id="btn-signout">Sign Out</button>
    </div>
</header>

<div class="save-indicator" id="saveMsg">Saved</div>

<div class="modal-overlay" id="typeModal" onclick="closeModal(event)">
    <div class="modal-box">
        <div class="modal-title">Select Item Type</div>
        <div class="modal-btn-row">
            <div class="modal-btn is-door" onclick="selectType('door')">
                <svg viewBox="0 0 24 24"><path d="M8 3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8zm8 16H8V5h8v14zm-2-8h-2v2h2v-2z"/></svg>
                Door
            </div>
            <div class="modal-btn is-window" onclick="selectType('window')">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-9-2h2v-2h-2v2zm0-4h2v-2h-2v2zm0-4h2V7h-2v2z"/></svg>
                Window
            </div>
        </div>
    </div>
</div>

<div class="main-wrapper">
    <div class="container" id="pdf-content">
        
        <div class="job-cover-page">
            <div class="cover-header">
                <h1>SimplyDoors</h1>
                <p>Field Measurement Sheet</p>
            </div>

            <div class="section cover-box">
                <div class="section-title">Project Details</div>
                <div class="print-group">

<script>
    // Embedded Service Worker for offline HTML caching (PWA logic)
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'simplydoors-cache-v2';
            self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll([location.pathname]))); self.skipWaiting(); });
            self.addEventListener('activate', e => { e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => { if (k !== CACHE_NAME) return caches.delete(k); })))); self.clients.claim(); });
            self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(res => res || fetch(e.request))); });
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Registration failed', err));
    }

    const container = document.getElementById('measure-container');
    const saveMsg = document.getElementById('saveMsg');
    const modal = document.getElementById('typeModal');
    
    let saveTimeout;
    let isAppInitialized = false;
    let currentJobId = null;

    const techDatabase = {
        "Adem Atis": { phone: "210-870-9083", email: "adem@simplydoors.com" },
        "Damian Azpurua": { phone: "(726) 437-5380", email: "DamianAzpuruausa@gmail.com" },
        "John Suttin": { phone: "", email: "" }, 
        "Steven Chandler": { phone: "", email: "" },
        "Isaiah Stratton": { phone: "", email: "" },
        "Paz Galambos": { phone: "", email: "" },
        "Alan Lloyd": { phone: "", email: "" }
    };

    window.addEventListener('beforeunload', function (e) { e.preventDefault(); e.returnValue = ''; });
    
    // Background Save Hook (Crucial to prevent data loss on device lock/tab switch)
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') performSave();
    });

    const optsFractions = ['', '1/8', '1/4', '3/8', '1/2', '5/8', '3/4', '7/8'];
    const getFracOpts = (sel) => optsFractions.map(f => `<option value="${f}" ${f===sel?'selected':''}>${f===''?'':f}</option>`).join('');

    window.startAppAfterAuth = async function() { 
        if(isAppInitialized) return;
        isAppInitialized = true;

        currentJobId = localStorage.getItem('currentJobId');
        if(!currentJobId) {
            currentJobId = 'job_' + Date.now();
            localStorage.setItem('currentJobId', currentJobId);
        }

        await loadData(); 
    };

    function openModal() { modal.style.display = 'flex'; }
    function closeModal(e) { if(e.target === modal) modal.style.display = 'none'; }
    function selectType(type) {
        modal.style.display = 'none';
        if(type === 'door') addDoor();
        else addWindow();
    }
    
    function openHistory() {
        document.getElementById('history-overlay').style.display = 'flex';
        if(window.loadHistoryList) window.loadHistoryList();
    }

    function renderPhotoBox(num, dataUrl) {
        const hasImg = dataUrl ? 'has-image' : '';
        const imgSrc = dataUrl || '';
        const displayImg = dataUrl ? 'block' : 'none';
        const displayPlace = dataUrl ? 'none' : 'block';
        return `
        <div class="photo-box ${hasImg}" onclick="triggerFile(event, this)">
            <div class="photo-clear" onclick="clearPhoto(event, this)">×</div>
            <div class="photo-placeholder" style="display:${displayPlace}">📷<br>Photo ${num}</div>
            <div class="photo-spinner"></div>
            <img class="photo-preview" src="${imgSrc}" style="display:${displayImg}">
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this)">
        </div>`;
    }

    function renderToggleField(label, val, options, fieldName) {
        const isCustom = val && !options.includes(val) && val !== '';
        const selStyle = isCustom ? 'display:none' : 'display:block';
        const inpStyle = isCustom ? 'display:flex' : 'display:none';
        let optsHtml = '<option value="" disabled selected>Select...</option>';
        options.forEach(opt => { optsHtml += `<option ${(opt === val) ? 'selected' : ''}>${opt}</option>`; });
        optsHtml += `<option value="Custom">Custom (Type...)</option>`;
        return `
        <div class="print-group toggle-field-wrapper">
            <label>${label}</label>
            <div class="toggle-wrapper">
                <select class="save-me-dynamic door-input" name="${fieldName}_sel" style="${selStyle}" onchange="checkCustom(this)">${optsHtml}</select>
                <div class="custom-input-group" style="${inpStyle}">
                    <input type="text" class="door-input" name="${fieldName}_inp" value="${isCustom ? val : ''}" oninput="triggerSave()">
                    <button type="button" class="undo-btn" onclick="resetToggle(this)">×</button>
                </div>
            </div>
        </div>`;
    }
    
    function checkCustom(select) {
        if(select.value === 'Custom') {
            const wrap = select.parentElement;
            select.style.display = 'none';
            wrap.querySelector('.custom-input-group').style.display = 'flex';
            wrap.querySelector('input').focus();
        }
        triggerSave();
    }
    function resetToggle(btn) {
        const wrap = btn.closest('.toggle-wrapper');
        wrap.querySelector('input').value = '';
        wrap.querySelector('select').value = '';
        wrap.querySelector('.custom-input-group').style.display = 'none';
        wrap.querySelector('select').style.display = 'block';
        triggerSave();
    }

    function renderWallThickField(valWhole, valFrac) {
        const presets = ["4 9/16", "6 9/16", "3 1/2", "5 1/2"];
        const currentCombined = (valWhole && valFrac) ? `${valWhole} ${valFrac}` : valWhole;
        const isCustom = !presets.includes(currentCombined) && (valWhole !== '' || valFrac !== '');
        const selStyle = isCustom ? 'display:none' : 'display:block';
        const inpStyle = isCustom ? 'display:flex' : 'display:none';
        let optsHtml = '<option value="" disabled selected>Select...</option>';
        presets.forEach(p => { 
            const sel = (p === currentCombined) ? 'selected' : '';
            optsHtml += `<option value="${p}" ${sel}>${p}</option>`; 
        });
        optsHtml += `<option value="Custom">Custom (Type...)</option>`;
        return `
        <div class="print-group wall-thick-wrapper">
            <label>Wall Thick</label>
            <select class="wall-preset save-me-dynamic win-input" name="wall_sel" style="${selStyle}" onchange="toggleWallThick(this)">${optsHtml}</select>
            <div class="composite-input wall-custom" style="${inpStyle}">
                <input type="text" inputmode="decimal" name="wall_w" class="save-me-dynamic win-input" value="${valWhole}" placeholder="0" oninput="triggerSave()">
                <select class="save-me-dynamic win-input" name="wall_f" onchange="triggerSave()">${getFracOpts(valFrac)}</select>
                <button type="button" class="undo-btn" onclick="resetWallThick(this)" style="margin-left:5px; height:42px; width:40px;">×</button>
            </div>
        </div>`;
    }

    function toggleWallThick(select) {
        if(select.value === 'Custom') {
            const wrap = select.parentElement;
            select.style.display = 'none';
            wrap.querySelector('.wall-custom').style.display = 'flex';
        }
        triggerSave();
    }
    function resetWallThick(btn) {
        const wrap = btn.closest('.wall-thick-wrapper');
        const sel = wrap.querySelector('.wall-preset');
        const customDiv = wrap.querySelector('.wall-custom');
        customDiv.style.display = 'none';
        sel.style.display = 'block';
        sel.value = "";
        customDiv.querySelector('input').value = "";
        customDiv.querySelectorAll('select')[0].value = "";
        triggerSave();
    }

    const doorConfig = ['Single', 'Double', 'Sgl w/ 1 SL', 'Sgl w/ 2 SL'];
    const doorHanding = ['Left Hand Inswing', 'Right Hand Inswing', 'Left Hand Outswing', 'Right Hand Outswing', 'Slider'];

            jamb: '', bore: '', ext: '', int: '', 
            l_tile: false, l_wood: false, l_cem: false, l_wsupp: false, l_custom: '',

        const html = `
        <div class="measure-card" id="${id}" data-type="door">
            <div class="pdf-brand">Door Measurement</div>
            <div class="card-header">
                <div class="card-badge">DOOR #${count}</div>

            </div>
            
            <div class="print-group">
                <label>Location Name</label>
                <input type="text" class="save-me-dynamic door-input" name="loc" placeholder="e.g. Front Entry" value="${vals.loc}">
            </div>
            
            <div class="print-group">
                <div class="row">
                    <div class="col">${renderToggleField('Config', vals.config, doorConfig, 'config')}</div>
                    <div class="col">${renderToggleField('Handing', vals.handing, doorHanding, 'handing')}</div>
                </div>
            </div>

            <div class="print-group">
                <label>Dimensions</label>
                <div class="row">
                    <div class="col" style="flex: 1.2;">
                        <span class="sub-label">Type</span>
                        <select class="save-me-dynamic door-input" name="dim_type">
                            <option value="" disabled ${vals.dim_type===''?'selected':''}>Select...</option>
                            <option ${vals.dim_type==='Unit Size'?'selected':''}>Unit Size</option>
                            <option ${vals.dim_type==='Rough Opening'?'selected':''}>Rough Opening</option>
                        </select>
                    </div>
                    <div class="col" style="flex: 2;">
                        <span class="sub-label">Width</span>
                        <div class="composite-input">
                            <input type="text" inputmode="decimal" class="save-me-dynamic door-input" name="w" value="${vals.w}" placeholder='0"'>
                            <select class="save-me-dynamic door-input" name="w_frac">${getFracOpts(vals.w_frac)}</select>
                        </div>
                    </div>
                    <div class="col" style="flex: 2;">
                        <span class="sub-label">Height</span>
                        <div class="composite-input">
                            <input type="text" inputmode="decimal" class="save-me-dynamic door-input" name="h" value="${vals.h}" placeholder='0"'>

                    <div class="col">${renderToggleField('Bore / Lock', vals.bore, ['Single Bore','Double Bore','Mortise','None'], 'bore')}</div>

                    <div class="col">${renderToggleField('Int Trim', vals.int, ['2 1/4 Casing','2 1/2 Col. Casing','3 1/4 Casing','1x4','No Trim'], 'int')}</div>
                </div>
            </div>

            <div class="print-group">
                <label>Labor Required</label>
                <div class="checklist-container door-labor-container">
                    <div class="checklist-item ${vals.l_tile?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Cut Tile</span></div>
                    <div class="checklist-item ${vals.l_wood?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Cut Wood</span></div>
                    <div class="checklist-item ${vals.l_cem?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Cement Support</span></div>
                    <div class="checklist-item ${vals.l_wsupp?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">Wood Support</span></div>
                    <input type="text" class="save-me-dynamic door-input" name="l_custom" placeholder="Custom Labor..." value="${vals.l_custom}" style="margin-top:8px;">
                </div>
            </div>

            <div class="print-group">
                <label>Notes</label><textarea class="save-me-dynamic door-input" name="notes">${vals.notes}</textarea>
            </div>

            <div class="photo-grid">
                ${renderPhotoBox(1, vals.p1)}
                ${renderPhotoBox(2, vals.p2)}
                ${renderPhotoBox(3, vals.p3)}
            </div>
        </div>`;
        insertAndInit(html, id, data);
    }

    function addWindow(data = null) {
        if(container.querySelector('.empty-state')) container.innerHTML = '';
        const count = container.querySelectorAll('.measure-card').length + 1;
        const vals = data || {
            loc: '', floor: '1st', qty: '1', mType: '', measurements: [{w:'',wf:'',h:'',hf:''}],
            sill: '', sill_f: '', wall: '', wall_f: '', tempered: false, mat: '', frame: '',
            ext: '', int: '', labor: [], customLabor: '', notes: '', p1:null, p2:null, p3:null
        };
        const id = 'card_' + Date.now() + Math.floor(Math.random()*1000);
        const tempClass = vals.tempered ? 'is-tempered' : '';

        const html = `
        <div class="measure-card" id="${id}" data-type="window">
            <div class="pdf-brand">Window Measurement</div>
            <div class="card-header">
                <div class="card-badge">WINDOW #${count}</div>
                <button class="btn-delete" onclick="deleteItem('${id}')">×</button>
            </div>

            <div class="print-group">
                <div class="row">
                    <div class="col" style="flex:2"><label>Loc/Mark</label><input type="text" name="loc" class="save-me-dynamic win-input" value="${vals.loc}"></div>
                    <div class="col"><label>Floor</label><select name="floor" class="save-me-dynamic win-input">
                        <option ${vals.floor==='1st'?'selected':''}>1st</option>
                        <option ${vals.floor==='2nd'?'selected':''}>2nd</option>
                        <option ${vals.floor==='3rd'?'selected':''}>3rd</option>
                    </select></div>
                    <div class="col" style="flex:0.6"><label>Qty</label><input type="number" name="qty" class="save-me-dynamic win-input" value="${vals.qty}"></div>
                </div>
            </div>

            <div class="print-group">
                <label>Measure Points</label>
                <select class="save-me-dynamic win-input" name="mType" style="margin-bottom:10px;">
                    <option value="" disabled ${vals.mType===''?'selected':''}>Basis (RO/Unit/DO)...</option>
                    <option ${vals.mType==='Rough Opening'?'selected':''}>Rough Opening</option>
                    <option ${vals.mType==='Unit Size'?'selected':''}>Unit Size</option>
                    <option ${vals.mType==='Daylight'?'selected':''}>Daylight</option>
                </select>
                <div class="measure-rows-container" id="rows_${id}"></div>
                <button type="button" class="btn-add-point" onclick="addMeasureRow('${id}')">+ Add Point</button>
            </div>

            <div class="print-group">
                <div class="row">
                    <div class="col">
                        <label>Floor to Sill</label>
                        <div class="composite-input">
                            <input type="text" inputmode="decimal" class="save-me-dynamic win-input" name="sill" value="${vals.sill}">
                            <select class="save-me-dynamic win-input" name="sill_f">${getFracOpts(vals.sill_f)}</select>
                        </div>
                    </div>
                    <div class="col" style="flex: 0.6;">
                        <div class="win-toggle-wrap ${tempClass}" style="margin-top:18px">
                            <div class="win-toggle-label">Tempered</div>
                            <label class="win-switch">
                                <input type="checkbox" class="save-me-dynamic win-input temp-check" name="tempered" ${vals.tempered?'checked':''} onchange="toggleTempered(this)">
                                <span class="slider"></span>
                                <div class="tempered-print-only" style="display:none">TEMPERED: YES</div>
                            </label>
                        </div>
                    </div>
                    <div class="col">
                        ${renderWallThickField(vals.wall, vals.wall_f)}
                    </div>
                </div>
            </div>

            <div class="print-group">
                <div class="row">
                    <div class="col"><label>Material</label><select name="mat" class="save-me-dynamic win-input">
                        <option value="" ${vals.mat===''?'selected':''}>Select...</option>
                        <option ${vals.mat==='Wood Stud'?'selected':''}>Wood Stud</option>
                        <option ${vals.mat==='CMU/Block'?'selected':''}>CMU/Block</option>
                    </select></div>
                    <div class="col"><label>Frame Depth</label><select name="frame" class="save-me-dynamic win-input">
                        <option value="" ${vals.frame===''?'selected':''}>Select...</option>
                        <option ${vals.frame==='4-1/2"'?'selected':''}>4-1/2"</option>
                        <option ${vals.frame==='6"'?'selected':''}>6"</option>
                    </select></div>
                </div>
            </div>
            
            <div class="print-group">
                <div class="row">
                    <div class="col"><label>Ext Trim</label><select name="ext" class="save-me-dynamic win-input">
                        <option value="" ${vals.ext===''?'selected':''}>Select...</option>
                        <option ${vals.ext==='1x4 Vinyl'?'selected':''}>1x4 Vinyl</option>
                        <option ${vals.ext==='No Trim'?'selected':''}>No Trim</option>
                    </select></div>
                    <div class="col"><label>Int Trim</label><select name="int" class="save-me-dynamic win-input">
                        <option value="" ${vals.int===''?'selected':''}>Select...</option>
                        <option ${vals.int==='Drywall'?'selected':''}>Drywall Return</option>
                        <option ${vals.int==='Casing'?'selected':''}>Casing</option>
                    </select></div>
                </div>
            </div>

            <div class="print-group">
                <label>Labor Required</label>
                <div class="checklist-container win-labor-container">
                    ${renderWinCheck('Cut Sheetrock/Wood', vals.labor)}
                    ${renderWinCheck('Cut Tile/Granite', vals.labor)}
                    ${renderWinCheck('Stucco Removal', vals.labor)}
                    <input type="text" name="customLabor" class="save-me-dynamic win-input" placeholder="Custom Labor..." value="${vals.customLabor}" style="margin-top:8px;">
                </div>
            </div>

            <div class="print-group">
                <label>Notes</label><textarea name="notes" class="save-me-dynamic win-input">${vals.notes}</textarea>
            </div>

            <div class="photo-grid">
                ${renderPhotoBox(1, vals.p1)}
                ${renderPhotoBox(2, vals.p2)}
                ${renderPhotoBox(3, vals.p3)}
            </div>
        </div>`;
        
        insertAndInit(html, id, data);
        if(vals.measurements) vals.measurements.forEach(m => addMeasureRow(id, m.w, m.wf, m.h, m.hf));
        else addMeasureRow(id);
    }

    function renderWinCheck(txt, arr) {
        return `<div class="checklist-item ${arr.includes(txt)?'active':''}" onclick="toggleCheck(this)"><div class="custom-checkbox"></div><span class="checklist-text">${txt}</span></div>`;
    }
    function toggleTempered(cb) {
        cb.closest('.win-toggle-wrap').classList.toggle('is-tempered', cb.checked);
        triggerSave();
    }
    function addMeasureRow(cardId, w='', wf='', h='', hf='') {
        const rowId = 'row_' + Date.now() + Math.floor(Math.random()*100);
        const html = `
        <div class="measure-row" id="${rowId}">
            <div class="col"><div class="composite-input"><input type="text" inputmode="decimal" class="m-w" value="${w}" placeholder="W"><select class="m-wf">${getFracOpts(wf)}</select></div></div>
            <div class="col"><div class="composite-input"><input type="text" inputmode="decimal" class="m-h" value="${h}" placeholder="H"><select class="m-hf">${getFracOpts(hf)}</select></div></div>
            <div class="remove-row" onclick="this.closest('.measure-row').remove(); triggerSave();">&times;</div>
        </div>`;
        document.getElementById(`rows_${cardId}`).insertAdjacentHTML('beforeend', html);
    }

    function insertAndInit(html, id, data) {
        container.insertAdjacentHTML('beforeend', html);
        const card = document.getElementById(id);
        card.querySelectorAll('.save-me-dynamic').forEach(el => {
            el.addEventListener('input', triggerSave);
            el.addEventListener('change', triggerSave);
        });
        if(!data) { 
            setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "center" }), 150); 
            triggerSave();
        }
    }

    function toggleCheck(item) { item.classList.toggle('active'); triggerSave(); }
    function deleteItem(id) {
        if(confirm('Delete this item?')) {
            document.getElementById(id).remove(); renumber();
            if(container.querySelectorAll('.measure-card').length === 0) renderEmptyState();
            triggerSave();
        }
    }
    function renumber() {
        let d = 1, w = 1;
        document.querySelectorAll('.measure-card').forEach(c => {
            const badge = c.querySelector('.card-badge');
            if(c.dataset.type === 'door') badge.innerText = `DOOR #${d++}`;
            else badge.innerText = `WINDOW #${w++}`;
        });
    }

    function renderEmptyState() {
        container.innerHTML = `
        <div class="empty-state">
            <h3>Ready to Start</h3>
            <p>Fill out Project Details above.<br>Then tap <b>+ Add New</b> to measure.</p>
        </div>`;
    }

    async function duplicateLast() {
        const cards = container.querySelectorAll('.measure-card');
        if(cards.length === 0) return openModal();
        triggerSave(); 
        const last = cards[cards.length - 1];
        const lastType = last.dataset.type;
        const saved = window.loadFromDB ? await window.loadFromDB(currentJobId) : null;
        if(!saved || !saved.items || saved.items.length === 0) return;
        const lastData = saved.items[saved.items.length - 1];
        const clean = JSON.parse(JSON.stringify(lastData));
        clean.loc = ''; clean.notes = ''; clean.p1 = null; clean.p2 = null; clean.p3 = null;
        if(lastType === 'window') { clean.measurements = [{w:'',wf:'',h:'',hf:''}]; addWindow(clean); }
        else { clean.w = ''; clean.w_frac = ''; clean.h = ''; clean.h_frac = ''; addDoor(clean); }
    }

    function triggerSave() { clearTimeout(saveTimeout); saveTimeout = setTimeout(performSave, 800); }
    
    async function performSave() {
        if(!currentJobId) return;

        const glob = {
            cust: document.getElementById('cust_name').value,
            po: document.getElementById('po_num').value,
            date: document.getElementById('dateField').value,
            tech: document.getElementById('techSelect').value
        };

        const items = [];
        document.querySelectorAll('.measure-card').forEach(card => {
            const type = card.dataset.type;
            const imgs = card.querySelectorAll('.photo-preview');
            const getSrc = (imgEl) => (imgEl.src && imgEl.src !== window.location.href && (imgEl.src.startsWith('data:') || imgEl.src.startsWith('http'))) ? imgEl.src : null;
            const p1 = getSrc(imgs[0]);
            const p2 = getSrc(imgs[1]);
            const p3 = getSrc(imgs[2]);

            if(type === 'door') {
                const getToggleVal = (baseName) => {
                    const sel = card.querySelector(`[name="${baseName}_sel"]`); 
                    const inp = card.querySelector(`[name="${baseName}_inp"]`);
                    if (!sel || !inp) return '';
                    return (sel.style.display === 'none') ? inp.value : sel.value;
                };
                const checks = card.querySelectorAll('.door-labor-container .checklist-item');
                items.push({
                    type: 'door', loc: card.querySelector('[name="loc"]').value,
                    config: getToggleVal('config'), handing: getToggleVal('handing'),
                    dim_type: card.querySelector('[name="dim_type"]').value,
                    w: card.querySelector('[name="w"]').value, w_frac: card.querySelector('[name="w_frac"]').value,
                    h: card.querySelector('[name="h"]').value, h_frac: card.querySelector('[name="h_frac"]').value,
                    jamb: getToggleVal('jamb'), bore: getToggleVal('bore'), ext: getToggleVal('ext'), int: getToggleVal('int'),
                    l_tile: checks[0] && checks[0].classList.contains('active'), l_wood: checks[1] && checks[1].classList.contains('active'),
                    l_cem: checks[2] && checks[2].classList.contains('active'), l_wsupp: checks[3] && checks[3].classList.contains('active'),
                    l_custom: card.querySelector('[name="l_custom"]').value, notes: card.querySelector('[name="notes"]').value, p1, p2, p3
                });
            } else {
                const mRows = [];
                card.querySelectorAll('.measure-row').forEach(r => {
                    mRows.push({ w: r.querySelector('.m-w').value, wf: r.querySelector('.m-wf').value, h: r.querySelector('.m-h').value, hf: r.querySelector('.m-hf').value });
                });
                const laborArr = [];
                card.querySelectorAll('.win-labor-container .checklist-item.active .checklist-text').forEach(t => laborArr.push(t.innerText));
                const getWallVal = () => {
                    const preset = card.querySelector('[name="wall_sel"]'); 
                    const customWhole = card.querySelector('[name="wall_w"]');
                    const customFrac = card.querySelector('[name="wall_f"]'); 
                    if (preset && preset.value && preset.value !== 'Custom') { const parts = preset.value.split(' '); return { w: parts[0], f: parts[1] || '' }; } 
                    else if(customWhole) { return { w: customWhole.value, f: customFrac ? customFrac.value : '' }; }
                    return { w: '', f: '' };
                };
                const wallVals = getWallVal();
                items.push({
                    type: 'window', loc: card.querySelector('[name="loc"]').value, floor: card.querySelector('[name="floor"]').value, 
                    qty: card.querySelector('[name="qty"]').value, mType: card.querySelector('[name="mType"]').value, measurements: mRows,
                    sill: card.querySelector('[name="sill"]').value, sill_f: card.querySelector('[name="sill_f"]').value, tempered: card.querySelector('.temp-check').checked,
                    wall: wallVals.w, wall_f: wallVals.f, mat: card.querySelector('[name="mat"]').value, frame: card.querySelector('[name="frame"]').value,
                    ext: card.querySelector('[name="ext"]').value, int: card.querySelector('[name="int"]').value, labor: laborArr, customLabor: card.querySelector('[name="customLabor"]').value,
                    notes: card.querySelector('[name="notes"]').value, p1, p2, p3
                });
            }
        });

        try {
            if (window.saveToDB) {
                await window.saveToDB({ global: glob, items: items }, currentJobId);
                saveMsg.classList.remove('error'); saveMsg.innerText = "Saved to Cloud";
                saveMsg.style.opacity = '1'; setTimeout(() => saveMsg.style.opacity = '0', 1500);
            }
        } catch (e) {
            saveMsg.classList.add('error'); saveMsg.innerText = "⚠️ CLOUD ERROR!";
            saveMsg.style.opacity = '1'; console.error("Cloud save failed", e);
        }
    }

    window.renderLoadedData = function(data) {
        document.getElementById('cust_name').value = data.global.cust || '';
        document.getElementById('po_num').value = data.global.po || '';
        document.getElementById('dateField').value = data.global.date || '';
        document.getElementById('techSelect').value = data.global.tech || '';
        container.innerHTML = '';
        if(data.items && data.items.length > 0) {
            data.items.forEach(item => { if(item.type === 'door') addDoor(item); else addWindow(item); });
        } else { renderEmptyState(); }
    };

    window.loadSpecificJob = function(jobId, data) {
        currentJobId = jobId;
        localStorage.setItem('currentJobId', currentJobId);
        window.renderLoadedData(data);
    };

    async function loadData() {
        if (!window.loadFromDB) return;
        const data = await window.loadFromDB(currentJobId);
        
        if(!data || !data.global) { 
            const d = new Date();
            const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
            document.getElementById('dateField').value = `${year}-${month}-${day}`;
            renderEmptyState(); return; 
        }
        try {
            window.renderLoadedData(data);
        } catch(e) { console.error(e); renderEmptyState(); }
    }

    function downloadPDF() {
        const custName = document.getElementById('cust_name').value.trim();
        const techName = document.getElementById('techSelect').value;
        const poNum = document.getElementById('po_num').value.trim();
        
        if(!custName || !techName) { alert("⚠️ Please enter a Customer Name and select a Technician before generating the PDF."); return; }
        
        let filename = (custName || "Measure_Sheet").replace(/[^a-z0-9-_ ]/gi, '_');
        if(poNum) filename += " - " + poNum.replace(/[^a-z0-9-_ ]/gi, '_');
        filename += ".pdf";

        const techData = techDatabase[techName] || { phone: "", email: "" };
        const techInfoDiv = document.getElementById('pdf-tech-info');
        if(techData.phone || techData.email) {
            techInfoDiv.innerHTML = `<div style="margin-top:5px;"><strong>Contact:</strong> ${techData.phone}</div><div><strong>Email:</strong> ${techData.email}</div>`;
        } else { techInfoDiv.innerHTML = ""; }

        window.scrollTo(0,0); document.body.classList.add('printing-mode');
        document.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
        
        document.querySelectorAll('.print-group').forEach(group => {
            const inputs = group.querySelectorAll('input:not([type="file"]):not([type="checkbox"]), select, textarea');
            let hasValue = false;
            inputs.forEach(inp => {
                if(inp.tagName === 'SELECT') { if(inp.value && inp.value !== 'Custom' && !inp.options[inp.selectedIndex].disabled) hasValue = true; } 
                else if(inp.value.trim() !== '') { hasValue = true; }
            });
            if(group.querySelector('.checklist-item.active')) hasValue = true;
            if(group.querySelector('.temp-check') && group.querySelector('.temp-check').checked) hasValue = true;
            if(!hasValue) group.classList.add('hide-in-print');
        });

        document.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
        document.querySelectorAll('select').forEach(el => {
            el.querySelectorAll('option').forEach(o => {
                if(o.value == el.value) o.setAttribute('selected','selected');
                else o.removeAttribute('selected');
            });
        });

        const btn = document.getElementById('pdfBtn');
        const oldText = btn.innerText; btn.innerText = "Generating...";

        html2pdf().set({
            margin: [10,10,10,10], filename: filename, image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, scrollY: 0, windowWidth: 750 },
            jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'], avoid: ['.measure-card', '.photo-grid'] } 
        }).from(document.getElementById('pdf-content')).toPdf().output('blob').then(function(blob) {
            techInfoDiv.innerHTML = ""; 
            document.querySelectorAll('.hide-in-print').forEach(el => el.classList.remove('hide-in-print'));
            document.body.classList.remove('printing-mode'); btn.innerText = oldText;
            const file = new File([blob], filename, { type: "application/pdf" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: filename }).catch((error) => console.log('Share failed', error));
            } else {
                const url = URL.createObjectURL(blob); const a = document.createElement('a');
                a.href = url; a.download = filename; a.click();
            }
        }).catch(err => {
            console.error("PDF Generation Error", err);
            alert("⚠️ Error generating PDF. The device memory may be full or the images are too large. Please restart the app and try again.");
            techInfoDiv.innerHTML = ""; document.querySelectorAll('.hide-in-print').forEach(el => el.classList.remove('hide-in-print'));
            document.body.classList.remove('printing-mode'); btn.innerText = oldText;
        });
    }

    async function startNewJob() {
        if(confirm("⚠️ Start New Job? Your previous job is safely stored in the History tab.")) {
            localStorage.removeItem('currentJobId');
            location.reload();
        }
    }

    function triggerFile(e, box) { if(e.target.classList.contains('photo-clear')) return; box.querySelector('input').click(); }
    
    function clearPhoto(e, btn) {
        e.stopPropagation(); const box = btn.closest('.photo-box');
        const img = box.querySelector('.photo-preview');
        const currentSrc = img.src;

        box.classList.remove('has-image'); img.src = '';
        img.style.display = 'none'; box.querySelector('.photo-placeholder').style.display = 'block';
        box.querySelector('input').value = ''; 
        
        if (currentSrc && currentSrc.includes('firebasestorage') && window.deleteImageFromFirebase) {
            window.deleteImageFromFirebase(currentSrc);
        }

        triggerSave();
    }

    function processImage(input) {
        const file = input.files[0]; if(!file) return;
        const box = input.parentElement; const img = box.querySelector('.photo-preview');
        const spin = box.querySelector('.photo-spinner'); const place = box.querySelector('.photo-placeholder');
        place.style.display='none'; spin.style.display='block';
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const temp = new Image();
            temp.onload = function() {
                const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
                // Downscaled to 800px max width for crash prevention on iOS during PDF generation
                const MAX_WIDTH = 800; let scale = 1;
                if(temp.width > MAX_WIDTH) scale = MAX_WIDTH / temp.width;
                cvs.width = temp.width * scale; cvs.height = temp.height * scale;
                ctx.drawImage(temp, 0, 0, cvs.width, cvs.height);
                
                // Aggressive JPEG compression to prevent DOM bloating
                const base64Data = cvs.toDataURL('image/jpeg', 0.60); 
                
                if (window.uploadImageToFirebase) {
                    window.uploadImageToFirebase(base64Data).then(url => {
                        img.src = url; 
                        img.style.display='block'; spin.style.display='none';
                        box.classList.add('has-image'); 
                        cvs.width = 0; cvs.height = 0; triggerSave();
                    }).catch(err => {
                        console.error("Upload Error", err);
                        spin.style.display='none'; place.style.display='block';
                        alert("⚠️ Failed to upload photo to the cloud. Check your connection.");
                    });
                } else {
                    img.src = base64Data; 
                    img.style.display='block'; spin.style.display='none';
                    box.classList.add('has-image'); 
                    cvs.width = 0; cvs.height = 0; triggerSave();
                }
            }
            temp.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    
    document.querySelectorAll('.save-me').forEach(e => e.addEventListener('input', triggerSave));

    window.openModal = openModal; window.closeModal = closeModal; window.selectType = selectType;
    window.duplicateLast = duplicateLast; window.downloadPDF = downloadPDF; window.startNewJob = startNewJob;
    window.toggleTempered = toggleTempered; window.addMeasureRow = addMeasureRow; window.toggleCheck = toggleCheck;
    window.deleteItem = deleteItem; window.checkCustom = checkCustom; window.resetToggle = resetToggle;
    window.toggleWallThick = toggleWallThick; window.resetWallThick = resetWallThick; window.triggerFile = triggerFile;
    window.clearPhoto = clearPhoto; window.processImage = processImage; window.openHistory = openHistory;
</script>

<!-- =========================================
     FIREBASE SDK, AUTHENTICATION, FIRESTORE & STORAGE (PHASE 4)
     ========================================= -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, query, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCobxQaeehIRV6J0RJwG3Qvxl_7IZU4MkI",
      authDomain: "simplydoors-measure.firebaseapp.com",
      projectId: "simplydoors-measure",
      storageBucket: "simplydoors-measure.firebasestorage.app",
      messagingSenderId: "381360696007",
      appId: "1:381360696007:web:2fa0cc0aa5bb5a03c46ce2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const dbFirestore = getFirestore(app);
    const storage = getStorage(app);

    enableIndexedDbPersistence(dbFirestore).catch((err) => {
        if (err.code == 'failed-precondition') console.warn("Multiple tabs open, offline persistence is only enabled in one tab at a time.");
        else if (err.code == 'unimplemented') console.warn("The current browser does not support offline persistence.");
    });

    const loginOverlay = document.getElementById('login-overlay');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const btnSignin = document.getElementById('btn-signin');
    const errorDiv = document.getElementById('login-error');
    
    // Auth action buttons header
    const btnSignout = document.getElementById('btn-signout');
    const btnHistory = document.getElementById('btn-history');

    window.uploadImageToFirebase = async function(dataUrl) {
        if (!auth.currentUser) throw new Error("Not logged in");
        const uid = auth.currentUser.uid;
        const fileName = `job_photos/${uid}/${Date.now()}_${Math.floor(Math.random()*10000)}.jpg`;
        const storageRef = ref(storage, fileName);
        
        await uploadString(storageRef, dataUrl, 'data_url');
        return await getDownloadURL(storageRef);
    };

    window.deleteImageFromFirebase = async function(url) {
        try {
            const fileRef = ref(storage, url);
            await deleteObject(fileRef);
            console.log("Old image deleted from cloud.");
        } catch (e) {
            console.warn("Could not delete old image", e);
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginOverlay.style.display = 'none';
            btnSignout.style.display = 'inline-block';
            btnHistory.style.display = 'inline-block';
            
            // Phase 4: Save jobs to a dedicated Jobs collection based on the Job ID
            window.saveToDB = async function(data, jobId) {
                if (!auth.currentUser || !jobId) return;
                const uid = auth.currentUser.uid;
                const docRef = doc(dbFirestore, "users", uid, "jobs", jobId);
                await setDoc(docRef, data);
            };

            window.loadFromDB = async function(jobId) {
                if (!auth.currentUser || !jobId) return null;
                const uid = auth.currentUser.uid;
                const docRef = doc(dbFirestore, "users", uid, "jobs", jobId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) return docSnap.data();
                return null;
            };

            window.loadHistoryList = async function() {
                if(!auth.currentUser) return;
                const uid = auth.currentUser.uid;
                const listEl = document.getElementById('history-list');
                listEl.innerHTML = '<div style="text-align:center; color:#888; font-weight:bold; margin-top: 30px;">Loading Archive...</div>';
                
                try {
                    const q = query(collection(dbFirestore, "users", uid, "jobs"));
                    const querySnapshot = await getDocs(q);
                    
                    if(querySnapshot.empty) {
                        listEl.innerHTML = '<div style="text-align:center; color:#888; margin-top: 30px;">No saved jobs found. Start a new one!</div>';
                        return;
                    }
                    
                    let jobs = [];
                    querySnapshot.forEach((doc) => { jobs.push({ id: doc.id, ...doc.data() }); });
                    
                    // Sort descending (newest jobs first based on ID timestamp)
                    jobs.sort((a,b) => b.id.localeCompare(a.id));
                    
                    listEl.innerHTML = '';
                    jobs.forEach(job => {
                        const cust = job.global?.cust || 'Unnamed Customer';
                        const date = job.global?.date || 'No Date Available';
                        const po = job.global?.po ? `PO: ${job.global.po}` : '';
                        
                        const card = document.createElement('div');
                        card.className = "history-card";
                        card.innerHTML = `
                            <div>
                                <div class="history-card-title">${cust}</div>
                                <div class="history-card-sub">Date: ${date} ${po ? ' | ' + po : ''}</div>
                            </div>
                            <div class="history-card-action">Load &rarr;</div>
                        `;
                        card.onclick = () => {
                            window.loadSpecificJob(job.id, job);
                            document.getElementById('history-overlay').style.display = 'none';
                        };
                        listEl.appendChild(card);
                    });
                } catch(e) {
                    console.error(e);
                    listEl.innerHTML = '<div style="text-align:center; color:red; margin-top: 30px;">Error loading history. Check your connection.</div>';
                }
            };

            window.startAppAfterAuth(); 
            console.log("Logged in as:", user.email);
        } else {
            loginOverlay.style.display = 'flex';
            btnSignout.style.display = 'none';
            btnHistory.style.display = 'none';
        }
    });

    btnSignin.addEventListener('click', () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if(!email || !password) { errorDiv.innerText = "Please enter email and password."; return; }

        btnSignin.innerText = "Loading..."; errorDiv.innerText = "";

        signInWithEmailAndPassword(auth, email, password)
            .then(() => { btnSignin.innerText = "Sign In"; emailInput.value = ""; passwordInput.value = ""; })
            .catch((error) => {
                btnSignin.innerText = "Sign In";
                if(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    errorDiv.innerText = "Invalid email or password.";
                } else { errorDiv.innerText = error.message; }
            });
    });

    passwordInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') btnSignin.click(); });

    btnSignout.addEventListener('click', () => {
        signOut(auth).then(() => { location.reload(); }).catch((error) => console.error("Logout Error:", error));
    });
</script>
